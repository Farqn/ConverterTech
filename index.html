<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Yönlü Görsel Dönüştürücü - ConverterTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-cardbg p-6 rounded-2xl shadow-2xl border border-slate-800">
        
        <!-- Işıklı ve Yanıp Sönen ConverterTech Yazısı -->
        <div class="text-center mb-4">
            <h2 class="text-2xl md:text-3xl font-extrabold tracking-widest text-cyan-400 animate-pulse drop-shadow-[0_0_15px_rgba(34,211,238,0.8)] uppercase">
                ConverterTech
            </h2>
        </div>

        <h1 class="text-lg font-bold text-center mb-2 text-slate-200">Görsel Format ve Çözünürlük Dönüştürücü</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Fotoğraflarınızı yükleyin, boyutlandırın ve dilediğiniz formata dönüştürün.</p>

        <!-- Sürükle Bırak Alanı -->
        <div id="drop-zone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 transition-all bg-slate-900/50 mb-6">
            <svg class="w-12 h-12 mx-auto text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            <p class="text-sm font-medium">Görseli sürükleyip bırakın ya da <span class="text-blue-400 underline">dosya seçin</span></p>
            <input type="file" id="file-input" accept="image/*" class="hidden">
        </div>

        <!-- Önizleme ve Ayarlar -->
        <div id="preview-container" class="hidden space-y-4 mb-6">
            <div class="flex items-center gap-4 bg-slate-900 p-3 rounded-lg border border-slate-800">
                <img id="image-preview" class="w-16 h-16 object-cover rounded-md border border-slate-700">
                <div class="overflow-hidden">
                    <p id="file-name" class="text-sm font-medium truncate text-slate-200"></p>
                    <p id="file-size" class="text-xs text-slate-400"></p>
                </div>
            </div>

            <!-- Çözünürlük Ayarları -->
            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-3">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Çözünürlük Ayarla (Piksel):</label>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <span class="text-[10px] text-slate-400 block mb-1">Genişlik (Width)</span>
                        <input type="number" id="width-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400 block mb-1">Yükseklik (Height)</span>
                        <input type="number" id="height-input" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
                    </div>
                </div>
                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="lock-aspect" checked class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-blue-500 h-4 w-4">
                    <label for="lock-aspect" class="text-xs text-slate-300 cursor-pointer select-none">En-boy oranını sabitle (Orantılı yeniden boyutlandır)</label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hedef Format:</label>
                <select id="format-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/jpeg">JPEG / JPG (.jpg)</option>
                    <option value="image/webp">WebP (.webp)</option>
                    <option value="image/bmp">BMP (.bmp)</option>
                </select>
            </div>

            <button id="convert-btn" class="w-full bg-blue-600 hover:bg-blue-500 transition-colors font-semibold py-3 rounded-lg shadow-lg text-sm">
                Dönüştür, Boyutlandır ve İndir
            </button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const widthInput = document.getElementById('width-input');
        const heightInput = document.getElementById('height-input');
        const lockAspect = document.getElementById('lock-aspect');
        const formatSelect = document.getElementById('format-select');
        const convertBtn = document.getElementById('convert-btn');

        let selectedFile = null;
        let originalWidth = 0;
        let originalHeight = 0;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Lütfen geçerli bir görsel dosyası yükleyin!');
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
            
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                
                const img = new Image();
                img.onload = () => {
                    originalWidth = img.width;
                    originalHeight = img.height;
                    widthInput.value = originalWidth;
                    heightInput.value = originalHeight;
                    previewContainer.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // En-boy oranı kilidi mantığı
        widthInput.addEventListener('input', () => {
            if (lockAspect.checked && originalWidth > 0 && originalHeight > 0) {
                const val = parseInt(widthInput.value);
                if (!isNaN(val)) {
                    heightInput.value = Math.round((val / originalWidth) * originalHeight);
                }
            }
        });

        heightInput.addEventListener('input', () => {
            if (lockAspect.checked && originalWidth > 0 && originalHeight > 0) {
                const val = parseInt(heightInput.value);
                if (!isNaN(val)) {
                    widthInput.value = Math.round((val / originalHeight) * originalWidth);
                }
            }
        });

        convertBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            const targetWidth = parseInt(widthInput.value);
            const targetHeight = parseInt(heightInput.value);

            if (!targetWidth || !targetHeight || targetWidth <= 0 || targetHeight <= 0) {
                alert('Lütfen geçerli bir çözünürlük değeri girin!');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');

                    // JPEG/BMP için şeffaf arka planı beyaza çevir
                    const targetFormat = formatSelect.value;
                    if (targetFormat === 'image/jpeg' || targetFormat === 'image/bmp') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    // Kaliteli yeniden boyutlandırma
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        const extension = targetFormat.split('/')[1].replace('jpeg', 'jpg');
                        const originalName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.'));
                        a.download = `${originalName}-${targetWidth}x${targetHeight}.${extension}`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, targetFormat, 0.92);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(selectedFile);
        });
    </script>
</body>
</html>
